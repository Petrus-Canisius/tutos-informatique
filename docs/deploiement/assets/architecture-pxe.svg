<title id="title">Architecture FOG : DHCP existant, dnsmasq et serveur FOG</title><desc id="desc">Un client PXE reçoit la configuration IP du serveur DHCP, les informations de démarrage de dnsmasq ProxyDHCP et les fichiers d'imagerie du serveur FOG.</desc>
