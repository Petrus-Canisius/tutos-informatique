<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
<title id="title">Cycle des images FOG</title><desc id="desc">Capture d'une machine Windows de référence vers FOG, puis déploiement de cette image sur une machine cible sans données.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2b81bd"/></marker><style>.h{font:bold 23px Arial,sans-serif;fill:#1d415e}.s{font:17px Arial,sans-serif;fill:#58738b}.lab{font:bold 16px Arial,sans-serif;fill:#2b79af}</style></defs>
<rect width="1180" height="420" rx="20" fill="#f2f7fc"/>
<text x="590" y="58" text-anchor="middle" font-family="Arial" font-weight="700" font-size="28" fill="#20445f">Préparer  →  Capturer  →  Déployer  →  Vérifier</text>
<rect x="35" y="100" width="288" height="238" rx="17" fill="#fff" stroke="#c3d8e9" stroke-width="3"/><rect x="76" y="135" width="204" height="79" rx="10" fill="#173f65"/><text x="178" y="183" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#fff">Windows 11</text><text x="180" y="267" class="h" text-anchor="middle">Poste maître</text><text x="180" y="298" class="s" text-anchor="middle">Image de référence</text>
<rect x="443" y="100" width="288" height="238" rx="17" fill="#fff" stroke="#c3d8e9" stroke-width="3"/><rect x="486" y="135" width="202" height="80" rx="11" fill="#d9efff"/><path d="M509 156h154m-154 18h154m-154 18h104" stroke="#4492bd" stroke-width="7" stroke-linecap="round"/><text x="587" y="267" class="h" text-anchor="middle">Serveur FOG</text><text x="587" y="298" class="s" text-anchor="middle">Images stockées</text>
<rect x="855" y="100" width="288" height="238" rx="17" fill="#fff" stroke="#c3d8e9" stroke-width="3"/><rect x="898" y="135" width="202" height="80" rx="10" fill="#173f65"/><rect x="907" y="144" width="184" height="62" rx="6" fill="#d9efff"/><text x="999" y="267" class="h" text-anchor="middle">Poste cible</text><text x="999" y="298" class="s" text-anchor="middle">Disque restauré</text>
<path d="M330 210h98" stroke="#2b81bd" stroke-width="5" marker-end="url(#arr)"/><path d="M741 210h99" stroke="#2b81bd" stroke-width="5" marker-end="url(#arr)"/>
<text x="379" y="179" class="lab" text-anchor="middle">CAPTURE</text><text x="789" y="179" class="lab" text-anchor="middle">DEPLOY</text>
<text x="590" y="387" text-anchor="middle" class="s">Le déploiement écrase les données présentes sur la cible.</text>
</svg>