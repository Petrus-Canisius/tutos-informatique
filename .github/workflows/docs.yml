name: Publier la documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Zensical
        run: python -m pip install -r requirements.txt
      - name: Actualiser la dernière procédure publiée
        run: python tools/latest_procedure.py
      - name: Générer la documentation
        run: zensical build --clean
      - name: Préparer l'archive du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
