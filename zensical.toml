[project]
site_name = "IT Knowledge Base"
site_url = "https://petrus-canisius.github.io/tutos-informatique/"
site_description = "Procédures, tutoriels et fiches de dépannage informatique"
site_author = "Petrus-Canisius"
repo_url = "https://github.com/Petrus-Canisius/tutos-informatique"
repo_name = "Petrus-Canisius / Documentation"
edit_uri = "edit/main/docs/"
copyright = "Documentation technique - Petrus-Canisius"
extra_css = ["stylesheets/extra.css", "stylesheets/memoire.css", "stylesheets/fog.css", "stylesheets/latest-banner-v2.css", "stylesheets/categories-v1.css"]
extra_javascript = ["javascripts/site.js", "javascripts/memoire.js", "javascripts/latest-procedure.js"]
nav = [
  { "Accueil" = "index.md" },
  { "Catégories" = [
    { "Déploiement et gestion de parc" = ["deploiement/index.md", { "FOG Project" = "deploiement/fog-installation.md" }] },
    { "Windows" = "windows/index.md" },
    { "Windows Server" = "windows-server/index.md" },
    { "Linux" = "linux/index.md" },
    { "Réseaux" = "reseaux/index.md" },
    { "Virtualisation" = "virtualisation/index.md" },
    { "PowerShell et automatisation" = "powershell/index.md" },
    { "Cybersécurité et OSINT" = "securite/index.md" },
    { "Git et GitHub" = "git-github/index.md" },
  ] },
  { "Mémoire de fin d’études" = "memoire/index.md" },
]

[project.theme]
language = "fr"
favicon = "images/favicon.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/book-open-check"
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/file-code"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Activer le mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Activer le mode clair"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
