[project]
site_name = "IT Knowledge Base"
site_url = "https://petrus-canisius.github.io/tutos-informatique/"
site_description = "Procédures, tutoriels et fiches de dépannage informatique"
site_author = "Petrus-Canisius"
repo_url = "https://github.com/Petrus-Canisius/tutos-informatique"
repo_name = "Petrus-Canisius / Documentation"
edit_uri = "edit/main/docs/"
copyright = "Documentation technique - Petrus-Canisius"
extra_css = ["stylesheets/extra.css", "stylesheets/memoire.css", "stylesheets/fog.css", "stylesheets/latest-banner-v2.css", "stylesheets/categories-v1.css", "stylesheets/ytdlp.css", "stylesheets/formation-ws2025.css"]
extra_javascript = ["javascripts/site.js", "javascripts/memoire.js", "javascripts/latest-procedure.js"]
nav = [
  { "Accueil" = "index.md" },
  { "Catégories" = [
    { "Déploiement et gestion de parc" = ["deploiement/index.md", { "FOG Project" = "deploiement/fog-installation.md" }] },
    { "Windows" = ["windows/index.md", { "Microsoft Activation Scripts (MAS)" = "windows/microsoft-activation-scripts.md" }, { "Installer Windows 11 sans compte Microsoft" = "windows/installation-compte-local.md" }, { "yt-dlp : téléchargement multimédia" = "windows/yt-dlp.md" }] },
    { "Windows Server" = [
    "windows-server/index.md",
    { "Formation Windows Server 2025" = [
      "windows-server/formation-2025/index.md",
      { "Préparer le laboratoire Hyper-V" = "windows-server/formation-2025/laboratoire.md" },
      { "01 · Comprendre les infrastructures" = "windows-server/formation-2025/01-fondamentaux.md" },
      { "02 · Éditions et nouveautés" = "windows-server/formation-2025/02-editions.md" },
      { "03 · Concevoir l'architecture" = "windows-server/formation-2025/03-architecture.md" },
      { "04 · Installer et configurer" = "windows-server/formation-2025/04-installation.md" },
      { "05 · Administration et outils" = "windows-server/formation-2025/05-administration.md" },
      { "06 · PowerShell professionnel" = "windows-server/formation-2025/06-powershell.md" },
      { "07 · Architecture AD DS" = "windows-server/formation-2025/07-ad-architecture.md" },
      { "08 · Déployer Active Directory" = "windows-server/formation-2025/08-ad-deploiement.md" },
      { "09 · Identités et privilèges" = "windows-server/formation-2025/09-identites.md" },
      { "10 · Stratégies de groupe" = "windows-server/formation-2025/10-gpo.md" },
      { "11 · Administrer DNS" = "windows-server/formation-2025/11-dns.md" },
      { "12 · DHCP et disponibilité" = "windows-server/formation-2025/12-dhcp.md" },
      { "Travaux pratiques" = "windows-server/formation-2025/travaux-pratiques.md" },
      { "Projet final" = "windows-server/formation-2025/projet-final.md" },
      { "Glossaire" = "windows-server/formation-2025/glossaire.md" }
    ] }
  ] },
    { "Linux" = "linux/index.md" },
    { "Réseaux" = "reseaux/index.md" },
    { "Virtualisation" = "virtualisation/index.md" },
    { "PowerShell et automatisation" = "powershell/index.md" },
    { "Cybersécurité et OSINT" = "securite/index.md" },
    { "Git et GitHub" = "git-github/index.md" },
  ] },
  { "Mémoire de fin d’études" = "memoire/index.md" },
]

[project.theme]
language = "fr"
favicon = "images/favicon.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/book-open-check"
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/file-code"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Activer le mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Activer le mode clair"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
