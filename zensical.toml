[project]
site_name = "Documentation informatique"
site_url = "https://petrus-canisius.github.io/tutos-informatique/"
site_description = "Procédures, tutoriels et fiches de dépannage informatique"
site_author = "Petrus-Canisius"
nav = [
  { "Accueil" = "index.md" },
  { "Windows" = [
    "windows/index.md",
    { "Maintenance Windows" = "windows/maintenance.md" },
  ] },
  { "Windows Server" = [
    "windows-server/index.md",
    { "Diagnostic DNS et AD" = "windows-server/dns-ad.md" },
  ] },
  { "Réseaux" = [
    "reseaux/index.md",
    { "Diagnostic réseau" = "reseaux/diagnostic.md" },
  ] },
  { "PowerShell" = [
    "powershell/index.md",
    { "Premiers scripts" = "powershell/scripts.md" },
  ] },
  { "Linux" = [
    "linux/index.md",
    { "Analyser les journaux" = "linux/journaux.md" },
  ] },
  { "Sécurité" = [
    "securite/index.md",
    { "Bonnes pratiques" = "securite/bonnes-pratiques.md" },
  ] },
  { "Dépannage" = [
    "depannage/index.md",
    { "Fiche d'incident" = "depannage/fiche-incident.md" },
  ] },
  { "Git et GitHub" = [
    "git-github/index.md",
    { "Premiers pas avec Git" = "git-github/premiers-pas.md" },
  ] },
  { "Modèle de procédure" = "modeles/modele-procedure.md" },
]

[project.theme]
language = "fr"
features = [
  "navigation.sections",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
